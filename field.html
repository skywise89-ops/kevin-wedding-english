<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="촬영 현장에서 바로 꺼내 쓰는 웨딩 영어 표현 치트시트 — 상황별 검색·즐겨찾기·발음 재생, 오프라인 동작">
<meta name="theme-color" content="#070f1b">
<title>현장 모드 · Kevin's Wedding English</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<header class="top">
  <div class="brand">⚡ 현장 모드</div>
  <div class="hdr-actions">
    <button class="iconbtn" type="button" id="ko-btn" aria-label="한국어 해석 표시 전환" title="한국어 해석 켜기/끄기">가</button>
    <button class="iconbtn" type="button" id="size-btn" aria-label="글자 크기" title="글자 크기">🔠</button>
    <button class="iconbtn" type="button" id="outdoor-btn" aria-label="야외 고대비 모드" title="야외 고대비 모드">🔆</button>
  </div>
</header>

<div class="wrap">
  <div class="fieldbar">
    <label class="sr-only" for="q">표현 검색</label>
    <input type="search" id="q" placeholder="⌕ 상황·한국어·영어로 검색 (예: 턱, rain, 단체)" autocomplete="off" enterkeyhint="search">
    <div class="chips" id="cats"></div>
  </div>

  <div id="pinned-wrap" hidden>
    <h2>📌 즐겨찾기 <span class="h2n" id="pin-count"></span></h2>
    <div id="pinned"></div>
  </div>

  <div id="results" style="margin-top:14px"><div class="empty">불러오는 중…</div></div>

  <footer>
    카드를 누르면 발음이 재생됩니다 · ☆ 를 누르면 맨 위로 고정됩니다<br>
    한 번 열어두면 인터넷 없이도 동작합니다 (홈 화면에 추가해두세요)
  </footer>
</div>

<script src="assets/core.js"></script>
<script src="assets/field.js"></script>
</body>
</html>
